name: Live UX v3 Capture

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-ux-v3.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture current live site
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser = await chromium.launch({headless:true});
          const url = 'https://jingol0818.github.io/humanity-open-problems-demo/';
          const d = await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[]; d.on('pageerror',e=>errors.push(String(e)));
          await d.goto(url,{waitUntil:'networkidle'});
          await d.screenshot({path:'v3-desktop.png',fullPage:true});
          const h1=await d.locator('h1').first().textContent();
          const how=await d.locator('.how-card').count();
          const disclosure=await d.locator('.prototype-disclosure').textContent().catch(()=>null);
          const sections=await d.locator('main > section').evaluateAll(nodes=>nodes.map(n=>n.className));
          fs.writeFileSync('v3-check.txt',JSON.stringify({h1,how,disclosure,sections,errors},null,2));
          const m = await browser.newPage({viewport:{width:390,height:844},isMobile:true});
          await m.goto(url,{waitUntil:'networkidle'});
          await m.screenshot({path:'v3-mobile.png',fullPage:true});
          await browser.close();
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: live-v3-capture
          path: |
            v3-desktop.png
            v3-mobile.png
            v3-check.txt
          retention-days: 1
